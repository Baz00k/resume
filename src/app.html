<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400..500&display=swap"
		/>
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<title>Jakub Buzuk</title>
		<meta name="description" content="Jakub Buzuk's resume" />
		<script>
			// Apply the saved theme, or the system one, before first paint.
			try {
				document.documentElement.dataset.theme =
					localStorage.getItem('theme') ??
					(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
			} catch {
				document.documentElement.dataset.theme = 'light';
			}
		</script>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="min-h-screen bg-page text-ink transition-colors duration-500"
	>
		<div class="grid grid-cols-1">%sveltekit.body%</div>
	</body>
</html>
